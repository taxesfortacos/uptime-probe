name: probe
# Outside check of a web service every 5 minutes (GitHub's scheduler can lag).
# Secrets: TARGET_URL (expects 200/302/401), TARGET_URL_2 (expects 200), SLACK_BOT_TOKEN, SLACK_CHANNEL, SLACK_THREAD_TS, ALERT_MENTION.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send one clearly labelled TEST alert with the current result'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          TARGET_URL_2: ${{ secrets.TARGET_URL_2 }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_THREAD_TS: ${{ secrets.SLACK_THREAD_TS }}
          ALERT_MENTION: ${{ secrets.ALERT_MENTION }}
          TEST: ${{ inputs.test }}
        run: python3 probe.py
      - name: save state on change
        run: |
          if ! git diff --quiet state.json; then
            git config user.name probe-bot
            git config user.email probe-bot@users.noreply.github.com
            git commit -m "state: $(python3 -c 'import json;print(json.load(open("state.json"))["status"])')" state.json
            git push
          fi
      - name: keep schedule enabled (public repos pause schedules after 60 idle days)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H%M)" -lt 0010 ]; then
            curl -s -o /dev/null -w 'keepalive %{http_code}\n' -X PUT -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/probe.yml/enable"
          fi
